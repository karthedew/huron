apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: huron
    includeSelectors: true
resources:
  - migrate-job.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - uploads.yaml
configMapGenerator:
  # huron.yaml becomes the ConfigMap huron-config-<hash>: a change renames it, which rolls the API.
  - name: huron-config
    files: [huron.yaml]
  # The nginx configuration of the upload proxy. A change renames it, which rolls the upload pod.
  - name: huron-uploads-nginx
    files: [nginx-uploads.conf.template]
images:
  - name: huron
    newName: image-registry.openshift-image-registry.svc:5000/huron/huron
    newTag: "1.0.0"
