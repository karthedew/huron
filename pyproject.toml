[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "huron"
version = "1.0.0"
description = "Catalog and access-control plane for raw scientific data on NFS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "jsonschema[format-nongpl]>=4.23",
    "google-re2>=1.1",
    "rfc8785>=0.1.4",
    "structlog>=24.1",
    "typer>=0.12",
    "rich>=13.7",
    "questionary>=2.0",
    "pyyaml>=6.0",
    "uuid-utils>=0.9",
]

[project.scripts]
huron = "huron.applications.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/huron"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "ty>=0.0.1a20",
    "import-linter>=2.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "testcontainers[postgres]>=4.8",
    "respx>=0.21",
    "radon>=6.0.1",
    "complexipy>=3.0",
    "types-jsonschema",
    "types-pyyaml",
    "asyncpg-stubs",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH", "RUF", "FAST"]
ignore = ["RUF001", "RUF002", "RUF003", "N818"]

[tool.ruff.lint.per-file-ignores]
"src/huron/applications/api/**" = ["TC001", "TC002", "TC003"]
"src/huron/applications/cli/**" = ["TC001", "TC002", "TC003", "B008"]
"tests/**" = ["TC001", "TC002", "TC003"]
"migrations/**" = ["E501", "TC002"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["huron"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["re2", "rfc8785", "questionary", "questionary.*", "testcontainers.*", "uuid_utils"]
ignore_missing_imports = true

[tool.ty.src]
include = ["src"]

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "contract: store contract suite against PostgreSQL",
    "integration: API over PostgreSQL and the CLI over the in-process API",
    "acl: real getfacl/setfacl round trips",
]

[tool.coverage.run]
source = ["src/huron"]
branch = false
omit = ["src/huron/applications/api/main.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
    "@overload",
    "if __name__ == .__main__.:",
]

[tool.importlinter]
root_package = "huron"

[[tool.importlinter.contracts]]
name = "huron.pkg is independent of every other huron package"
type = "forbidden"
source_modules = ["huron.pkg"]
forbidden_modules = ["huron.schema", "huron.core", "huron.applications"]

[[tool.importlinter.contracts]]
name = "huron.schema imports only huron.pkg"
type = "forbidden"
source_modules = ["huron.schema"]
forbidden_modules = ["huron.core", "huron.applications"]

[[tool.importlinter.contracts]]
name = "core.security does not import lake, metastore, storage or applications"
type = "forbidden"
source_modules = ["huron.core.security"]
forbidden_modules = [
    "huron.core.lake",
    "huron.core.metastore",
    "huron.core.storage",
    "huron.applications",
]

[[tool.importlinter.contracts]]
name = "core.lake does not import metastore, storage or applications"
type = "forbidden"
source_modules = ["huron.core.lake"]
forbidden_modules = ["huron.core.metastore", "huron.core.storage", "huron.applications"]

[[tool.importlinter.contracts]]
name = "only applications import the metastore"
type = "forbidden"
source_modules = ["huron.pkg", "huron.schema", "huron.core.lake", "huron.core.security", "huron.core.storage"]
forbidden_modules = ["huron.core.metastore"]

[[tool.importlinter.contracts]]
name = "the API does not import the CLI or storage"
type = "forbidden"
source_modules = ["huron.applications.api"]
forbidden_modules = ["huron.applications.cli", "huron.core.storage"]

[[tool.importlinter.contracts]]
name = "the CLI does not import the API, the metastore or the broker"
type = "forbidden"
source_modules = ["huron.applications.cli"]
forbidden_modules = ["huron.applications.api", "huron.core.metastore", "huron.core.security.broker"]

[[tool.importlinter.contracts]]
name = "lake areas never import another area's operations"
type = "forbidden"
source_modules = [
    "huron.core.lake.organizations.models",
    "huron.core.lake.catalogs.models",
    "huron.core.lake.namespaces.models",
    "huron.core.lake.collections.models",
    "huron.core.lake.files.models",
    "huron.core.lake.schemas.models",
    "huron.core.lake.audit.models",
]
forbidden_modules = [
    "huron.core.lake.organizations.operations",
    "huron.core.lake.catalogs.operations",
    "huron.core.lake.namespaces.operations",
    "huron.core.lake.collections.lifecycle",
    "huron.core.lake.files.commits",
    "huron.core.lake.schemas.registry",
    "huron.core.lake.schemas.completeness",
]
