repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, toml]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, toml]

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types_or: [python, toml]
        pass_filenames: false

      - id: lint-imports
        name: import-linter
        entry: uv run lint-imports
        language: system
        types_or: [python, toml]
        pass_filenames: false

      - id: schema-map-current
        name: schema map current
        entry: uv run python scripts/check_schema_map.py
        language: system
        pass_filenames: false
        files: ^migrations/
