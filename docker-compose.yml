name: huron

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: huron
      POSTGRES_USER: huron
      POSTGRES_PASSWORD: huron
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huron -d huron"]
      interval: 2s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm", "--http-port=8081"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports: ["8081:8081"]
    volumes:
      - ./scripts/keycloak/company-realm.json:/opt/keycloak/data/import/company-realm.json:ro
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 60

  migrate:
    profiles: [app]
    build: {context: ., dockerfile: Containerfile}
    command: ["alembic", "upgrade", "head"]
    env_file: dev.env
    environment:
      HURON_DATABASE_URL: postgresql://huron:huron@postgres:5432/huron
    depends_on:
      postgres: {condition: service_healthy}

  groups:
    profiles: [app]
    image: python:3.12-slim
    command: ["sh", "-c", "pip install --quiet pyyaml && python /scripts/devgroups.py /scripts/dev-groups.yaml 8082"]
    volumes: ["./scripts:/scripts:ro"]
    ports: ["8082:8082"]

  api:
    profiles: [app]
    build: {context: ., dockerfile: Containerfile}
    env_file: dev.env
    environment:
      HURON_DATABASE_URL: postgresql://huron:huron@postgres:5432/huron
      HURON_GROUP_DIRECTORY_URL: http://groups:8082
    ports: ["8080:8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      groups: {condition: service_started}
      keycloak: {condition: service_healthy}

volumes:
  postgres-data:
  keycloak-data:
