<svg xmlns="http://www.w3.org/2000/svg" width="720" height="584" viewBox="0 0 720 584" role="img" aria-labelledby="title desc">
  <title id="title">Huron components</title>
  <desc id="desc">The browser uses the web server. The web and CLI call the API, which stores records in PostgreSQL. At token exchange, the API checks the company token and reads the user's groups. Only the CLI accesses the NFS share.</desc>
  <style>
    svg { --panel: #f5f8f8; --card: #ffffff; --ink: #18282c; --muted: #4e6269; --border: #b4c7c9; --accent: #00766a; --tint: #e2faf6; font-family: system-ui, sans-serif; }
    .panel { fill: var(--panel); stroke: var(--border); }
    .card { fill: var(--card); stroke: var(--border); stroke-width: 1.5; }
    .primary { fill: var(--tint); stroke: var(--accent); stroke-width: 1.5; }
    .edge { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; marker-end: url(#arrow); }
    .arrow { fill: var(--accent); }
    text { fill: var(--ink); text-anchor: middle; font-size: 17px; font-weight: 600; }
    .heading { fill: var(--accent); text-anchor: start; font-size: 13px; letter-spacing: 1.4px; }
    .detail { fill: var(--muted); font-size: 12px; font-weight: 400; }
    .note { fill: var(--muted); font-size: 13px; font-weight: 400; text-anchor: start; }
    @media (prefers-color-scheme: dark) {
      svg { --panel: #1b2029; --card: #242b36; --ink: #edf4f5; --muted: #bacbd0; --border: #52616c; --accent: #8ff0e2; --tint: #0e3834; }
    }
    @media (forced-colors: active) {
      svg { --panel: Canvas; --card: Canvas; --ink: CanvasText; --muted: CanvasText; --border: CanvasText; --accent: LinkText; --tint: Canvas; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="arrow" d="M 1 1 L 9 5 L 1 9 Z" />
    </marker>
  </defs>
  <rect class="panel" x="8" y="8" width="704" height="220" rx="16" />
  <text class="heading" x="28" y="40">01 · CATALOG REQUESTS</text>
  <path class="edge" d="M 160 106 H 202" />
  <path class="edge" d="M 336 106 H 378" />
  <path class="edge" d="M 512 106 H 554" />
  <path class="edge" d="M 336 174 H 358 V 124 H 378" />
  <rect class="card" x="28" y="76" width="132" height="60" rx="10" />
  <text x="94" y="102">Browser</text>
  <text class="detail" x="94" y="121">Session cookie</text>
  <rect class="card" x="204" y="76" width="132" height="60" rx="10" />
  <text x="270" y="102">Huron web</text>
  <text class="detail" x="270" y="121">Read-only catalog</text>
  <rect class="card" x="204" y="152" width="132" height="44" rx="10" />
  <text x="270" y="180">Huron CLI</text>
  <rect class="primary" x="380" y="76" width="132" height="60" rx="10" />
  <text x="446" y="102">Huron API</text>
  <text class="detail" x="446" y="121">Roles and records</text>
  <rect class="card" x="556" y="76" width="128" height="60" rx="10" />
  <text x="620" y="102">PostgreSQL</text>
  <text class="detail" x="620" y="121">Catalog of record</text>
  <text class="note" x="28" y="214">The clients call the API over HTTPS. File bytes take a separate path.</text>
  <rect class="panel" x="8" y="248" width="704" height="148" rx="16" />
  <text class="heading" x="28" y="280">02 · IDENTITY AT TOKEN EXCHANGE</text>
  <path class="edge" d="M 292 340 H 214" />
  <path class="edge" d="M 428 340 H 506" />
  <text class="detail" x="252" y="325">Verify token</text>
  <text class="detail" x="468" y="325">Read groups</text>
  <rect class="card" x="28" y="310" width="184" height="60" rx="10" />
  <text x="120" y="336">Company OIDC</text>
  <text class="detail" x="120" y="355">Identity provider</text>
  <rect class="primary" x="292" y="310" width="136" height="60" rx="10" />
  <text x="360" y="336">Huron API</text>
  <text class="detail" x="360" y="355">Issues Huron tokens</text>
  <rect class="card" x="508" y="310" width="176" height="60" rx="10" />
  <text x="596" y="336">Group directory</text>
  <text class="detail" x="596" y="355">LDAP groups</text>
  <rect class="panel" x="8" y="416" width="704" height="152" rx="16" />
  <text class="heading" x="28" y="450">03 · FILE ACCESS</text>
  <path class="edge" d="M 212 508 H 506" />
  <text class="detail" x="360" y="494">Files, directories and ACLs</text>
  <rect class="card" x="28" y="478" width="184" height="60" rx="10" />
  <text x="120" y="504">Huron CLI</text>
  <text class="detail" x="120" y="523">Machine with NFS mount</text>
  <rect class="primary" x="508" y="478" width="176" height="60" rx="10" />
  <text x="596" y="504">NFS share</text>
  <text class="detail" x="596" y="523">File bytes and sidecars</text>
</svg>
