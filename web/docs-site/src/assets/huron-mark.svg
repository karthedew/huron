<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" role="img" aria-labelledby="title desc">
	<title id="title">Huron mark</title>
	<desc id="desc">A chunked H representing scientific data arrays.</desc>
	<!-- Each tile is an addressable data chunk; the connected middle row forms the H bridge. -->
	<g>
		<g fill="#12304A">
			<rect x="12" y="12" width="20" height="20" rx="4" />
			<rect x="80" y="12" width="20" height="20" rx="4" />
			<rect x="12" y="36" width="20" height="20" rx="4" />
			<rect x="80" y="36" width="20" height="20" rx="4" />
			<rect x="12" y="60" width="20" height="20" rx="4" />
			<rect x="80" y="60" width="20" height="20" rx="4" />
			<rect x="12" y="84" width="20" height="20" rx="4" />
			<rect x="80" y="84" width="20" height="20" rx="4" />
		</g>
		<g>
			<rect x="36" y="44" width="18" height="20" rx="4" fill="#1678C5" />
			<rect x="57" y="44" width="18" height="20" rx="4" fill="#16BCD4" />
			<path d="M45 38V23" fill="none" stroke="#16BCD4" stroke-linecap="round" stroke-width="5" />
			<rect x="40" y="12" width="10" height="10" rx="3" fill="#16BCD4" />
		</g>
	</g>
</svg>
