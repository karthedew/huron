# PostgreSQL and Keycloak for running the API on the host (`make up`, then `make migrate` and
# `make api`). The whole application in Docker is docker-compose.app.yml (`make app`); both use the
# same ports, so run one at a time.
name: huron

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: huron
      POSTGRES_USER: huron
      POSTGRES_PASSWORD: huron
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huron -d huron"]
      interval: 2s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm", "--http-port=8081"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports: ["8081:8081"]
    volumes:
      - ./scripts/keycloak/company-realm.json:/opt/keycloak/data/import/company-realm.json:ro
      # Keeps the realm across restarts, so --import-realm skips the file once the realm exists:
      # after the file changes, recreate this volume (README.md, troubleshooting).
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 60

volumes:
  postgres-data:
  keycloak-data:
