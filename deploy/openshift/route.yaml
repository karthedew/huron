apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: huron
  annotations:
    # Schema assignment, a recursive repair and a collection delete do their disk work in the
    # request.
    haproxy.router.openshift.io/timeout: 300s
spec:
  # The public host of the API: `issuer` in huron.yaml. The Route huron-uploads (uploads.yaml)
  # takes the path /files of the same host.
  host: huron.apps.example.org
  to:
    kind: Service
    name: huron
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
