apiVersion: v1
kind: Service
metadata:
  name: {{ include "huron.fullname" . }}
  labels:
    {{- include "huron.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "huron.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
