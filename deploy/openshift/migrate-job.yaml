apiVersion: batch/v1
kind: Job
metadata:
  name: huron-migrate
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: huron
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: {name: huron}
            - secretRef: {name: huron}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
