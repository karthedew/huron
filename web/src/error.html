<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<title>%sveltekit.status% · Huron</title>
		<style>
			:root {
				color-scheme: light dark;
				--bg: #f6f7f9;
				--fg: #171a1f;
				--muted: #5f6773;
				--line: #e2e5e9;
				--card: #ffffff;
				--brand: #00c7ad;
				--accent: #007f72;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #111418;
					--fg: #edf0f2;
					--muted: #99a2ad;
					--line: #2b3037;
					--card: #181c21;
					--accent: #2cdbc4;
				}
			}
			/* Padding and borders inside each box's width, so the card never outgrows a phone. */
			*,
			*::before,
			*::after {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100dvh;
				display: grid;
				place-items: center;
				padding: 1.25rem;
				background: var(--bg);
				color: var(--fg);
				font:
					14px/1.5 Inter,
					ui-sans-serif,
					system-ui,
					-apple-system,
					'Segoe UI',
					sans-serif;
			}
			main {
				width: 100%;
				max-width: 28rem;
				border: 1px solid var(--line);
				border-radius: 10px;
				background: var(--card);
				padding: 1.5rem;
			}
			.brand {
				display: flex;
				align-items: center;
				gap: 0.6rem;
				font-weight: 600;
				font-size: 1.05rem;
			}
			.mark {
				display: grid;
				place-items: center;
				width: 2rem;
				height: 2rem;
				border-radius: 6px;
				background: var(--brand);
				color: #062d29;
				font-weight: 900;
			}
			h1 {
				margin: 1.25rem 0 0.4rem;
				font-size: 1.35rem;
				line-height: 1.3;
			}
			p {
				margin: 0;
				color: var(--muted);
				overflow-wrap: anywhere;
			}
			a {
				display: inline-block;
				margin-top: 1.25rem;
				color: var(--accent);
				font-weight: 600;
			}
		</style>
	</head>
	<body>
		<main>
			<div class="brand"><span class="mark" aria-hidden="true">H</span>Huron</div>
			<h1>Huron can't show this page (%sveltekit.status%)</h1>
			<p>%sveltekit.error.message%</p>
			<a href="/">Back to Huron</a>
		</main>
	</body>
</html>
