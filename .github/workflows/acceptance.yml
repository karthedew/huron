name: Acceptance

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --all-groups
      - run: df -h .
      - run: uv run pytest -m acceptance --no-header -q
