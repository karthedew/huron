# The upload pod: the upload proxy (nginx) in front of tusd, the Service and the Route of
# https://<host>/files/, and the claim of the lake, which the API pod mounts too.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: huron-uploads
  labels:
    app.kubernetes.io/component: uploads
spec:
  # tusd locks an upload with a lock file that holds its process ID, and the test that this
  # process is alive works only inside one PID namespace. So two tusd processes must never run
  # at the same time: one replica, and Recreate stops the old pod before the new pod starts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: uploads
  template:
    metadata:
      labels:
        app.kubernetes.io/component: uploads
    spec:
      # Longer than tusd's hook timeout (-hooks-http-timeout, 60 s): a final PATCH can wait that
      # long for the pre-finish hook.
      terminationGracePeriodSeconds: 90
      # The service user U and the service group G, as in deployment.yaml.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000700000
        runAsGroup: 1000700000
        supplementalGroups: [1000700000]
        seccompProfile: {type: RuntimeDefault}
      # Put the pod on the nodes that the export lets write, for example a dedicated node pool.
      nodeSelector: {}
      tolerations: []
      affinity: {}
      initContainers:
        # tusd runs as process 1 of its container. After an unclean stop, a new tusd finds its
        # own process ID in an old lock file and refuses the upload until the lock times out.
        # So this step removes the lock files before tusd starts. This is safe only because the
        # pod is the one tusd and the old pod is gone.
        - name: clean-locks
          image: tusproject/tusd:v2.10.1
          command:
            - sh
            - -c
            - cd "$HURON_UPLOAD_DIR" && rm -f -- *.lock *.lock.* *.stop
          env:
            - name: HURON_UPLOAD_DIR
              value: /data1/huron/.tus-uploads
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - name: lake
              mountPath: /data1/huron
      containers:
        # The image's entrypoint renders /etc/huron/nginx-uploads.conf.template into
        # /tmp/nginx-uploads.conf, then runs the arguments. `command:` would replace that
        # entrypoint, so the container sets `args:` only.
        - name: proxy
          image: nginx:1.31.8
          args: ["nginx", "-c", "/tmp/nginx-uploads.conf", "-g", "daemon off;"]
          env:
            - name: NGINX_ENVSUBST_TEMPLATE_DIR
              value: /etc/huron
            - name: NGINX_ENVSUBST_TEMPLATE_SUFFIX
              value: .template
            - name: NGINX_ENVSUBST_OUTPUT_DIR
              value: /tmp
            - name: NGINX_ENVSUBST_FILTER
              value: ^HURON_(API_UPSTREAM|UPLOADS_HOST|UPLOADS_PROTO)$
            # The API Service.
            - name: HURON_API_UPSTREAM
              value: huron:8080
            # The authority and the scheme of uploads_url in huron.yaml.
            - name: HURON_UPLOADS_HOST
              value: huron.apps.example.org
            - name: HURON_UPLOADS_PROTO
              value: https
          ports:
            - name: http
              containerPort: 1080
          # nginx answers /readyz from tusd's OPTIONS /files/ and /livez by itself. Neither
          # probe makes a call to the lake.
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /livez, port: http}
            timeoutSeconds: 3
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          volumeMounts:
            - name: nginx
              mountPath: /etc/huron
              readOnly: true
            - name: tmp
              mountPath: /tmp
        # tusd listens on 127.0.0.1:1081 behind the proxy, keeps its uploads in .tus-uploads with
        # private modes, and refuses download, termination and concatenation. It calls the API
        # for the hooks pre-create and pre-finish, with the client's Authorization, and waits
        # 60 s for a hook. -max-size=0 is no limit, the same as the default max_upload_bytes of
        # the API. The image's entrypoint runs tusd with these arguments.
        - name: tusd
          image: tusproject/tusd:v2.10.1
          args:
            - -host=127.0.0.1
            - -port=1081
            - -base-path=/files/
            - -upload-dir=/data1/huron/.tus-uploads
            - -behind-proxy
            - -disable-download
            - -disable-termination
            - -disable-concatenation
            - -max-size=0
            - -file-perms=0600
            - -dir-perms=0700
            - -hooks-http=http://huron:8080/api/v1/uploads/hooks
            - -hooks-http-forward-headers=Authorization
            - -hooks-enabled-events=pre-create,pre-finish
            - -hooks-http-timeout=60s
            - -hooks-http-retry=3
            - -hooks-http-backoff=1s
            - -request-completion-timeout=60s
            - -network-timeout=2m
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          volumeMounts:
            - name: lake
              mountPath: /data1/huron
      volumes:
        - name: lake
          persistentVolumeClaim: {claimName: huron-lake}
        - name: nginx
          configMap: {name: huron-uploads-nginx}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: huron-uploads
spec:
  selector:
    app.kubernetes.io/component: uploads
  ports:
    - name: http
      port: 1080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: huron-uploads
  annotations:
    # The final PATCH waits for the pre-finish hook. nginx (a read timeout of 120 s) and tusd (a
    # hook timeout of 60 s) end that wait sooner.
    haproxy.router.openshift.io/timeout: 3600s
spec:
  host: huron.apps.example.org
  path: /files
  to:
    kind: Service
    name: huron-uploads
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
# The lake. The cluster administrator binds this claim to the PersistentVolume of the export
# (ReadWriteMany). The mount options belong to that volume: vers=3, hard, sec=sys.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: huron-lake
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  resources:
    requests:
      storage: 1Ti
