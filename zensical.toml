# Zensical — the Material for MkDocs team's successor to MkDocs + Material,
# which are now in maintenance mode. Zensical reads this native format, and
# would also read a legacy mkdocs.yml; this project uses the native one because
# it does not keep compatibility shims around.
#
# This site documents the REPOSITORY — environment, checks, layout, tests.
# The architecture lives in design/ at the repository root and is authoritative;
# nothing here restates it.

[project]
site_name = "Huron"
site_description = "Developer documentation for the Huron control plane"
site_author = "Huron platform team"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Overview" = "getting-started/index.md" },
    { "Local development" = "getting-started/local-development.md" },
    { "Repository layout" = "getting-started/repository-layout.md" },
    { "Conventions" = "getting-started/conventions.md" },
    { "Docstrings" = "getting-started/docstrings.md" },
    { "Testing" = "getting-started/testing.md" },
  ] },
  { "Backend design" = "backend-design.md" },
  { "Implementation history" = "history.md" },
]

extra_css = ["stylesheets/extra.css"]

[project.theme]
language = "en"
# No webfont. This site is expected to be served on networks with no egress,
# where an external font request is both a broken dependency and a compliance
# problem. Verified after a build by grepping site/ for fonts.googleapis.com.
font = false
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "teal"
toggle.icon = "material/weather-night"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "teal"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to light mode"

[project.extra]
generator = false

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
toc.permalink_title = "Link to this section"
toc.toc_depth = 3
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
