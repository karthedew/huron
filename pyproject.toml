[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "huron"
version = "0.1.0"
description = "Control plane for a raw-data-first scientific lakehouse"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings>=2",
    "sqlalchemy>=2",
    "asyncpg",
    "alembic",
    "aiobotocore",
    "rfc8785",
    "jsonschema[format-nongpl]",
    "pyyaml",
    "httpx",
    "structlog",
    "prometheus-client",
    "pyjwt[crypto]>=2.13.0",
    "argon2-cffi>=25.1.0",
    "greenlet>=3.5.5",
    "asyncer>=0.0.18",
]

[tool.hatch.build.targets.wheel]
packages = ["src/huron"]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "import-linter",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "hypothesis",
    "testcontainers[postgres]",
    "respx",
    # mypy --strict reads huron.schema, which imports jsonschema; without these
    # stubs the type check fails on a clean checkout.
    "types-jsonschema",
    "ty>=0.0.75",
    "radon>=6.0.1",
    "complexipy>=7.0.1",
    "pyscn>=1.30.0 ; platform_machine == 'x86_64' or sys_platform == 'darwin'",
    # Checks every docstring against its signature: parameters, returns, yields
    # and raised exceptions. ruff's D rules prove a docstring exists and is well
    # formed; only pydoclint proves it is complete.
    "pydoclint>=0.9.1",
]
# Documentation toolchain. Install with:  uv sync --group docs
#
# Zensical is the Material for MkDocs team's successor to MkDocs + Material,
# both of which are now in maintenance mode. It reads the native zensical.toml
# at the repository root (it would also read a legacy mkdocs.yml; this project
# does not keep one). It brings its own markdown and pymdown-extensions, so
# they are not pinned separately here.
#
# Pinned exactly: Zensical is pre-1.0 and its config surface is still moving.
docs = [
    "zensical==0.0.57",
]

[tool.ruff]
line-length = 100
extend-exclude = ["*.md"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH", "RUF", "FAST", "D"]

[tool.ruff.lint.pydocstyle]
# Google style: a one-line summary, then Args / Returns / Yields / Raises
# sections. This is the one convention under which ruff also checks that an
# Args section names every parameter (D417); pydoclint (below) checks that the
# sections exist and match the signature.
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests document what they prove, not how they are called: every module,
# class, test and fixture carries a summary line, but a test double's
# __init__ and dunder methods add nothing a reader needs.
"tests/**" = ["D105", "D107"]
# A route's docstring is also its OpenAPI description. FastAPI truncates the
# description at a form feed, so the caller-facing prose comes first and the
# Args/Returns/Raises sections follow "\f" - which D301 would otherwise want
# a raw string for, defeating the escape.
"src/huron/applications/api/routes/**/endpoints/*.py" = ["D301"]
# app.py defines the two health probes the same way.
"src/huron/applications/api/app.py" = ["D301"]
# Stable public error names intentionally mirror their API codes.
"src/huron/pkg/auth/errors.py" = ["N818"]
"src/huron/pkg/auth/password.py" = ["N818"]
"src/huron/pkg/auth/principals.py" = ["N818"]
"src/huron/pkg/auth/sessions.py" = ["N818"]
"src/huron/pkg/catalog/errors.py" = ["N818"]
"src/huron/pkg/catalog/layers.py" = ["N818"]
# The role/rbac error names intentionally mirror their stable API codes.
"src/huron/pkg/rbac/roles.py" = ["N818"]
"src/huron/pkg/catalog/failures.py" = ["N818"]
# FastAPI resolves annotations at runtime; type-checking-only imports break
# dependency injection in these modules.
"src/huron/applications/api/**" = ["TC001", "TC002", "TC003"]

[tool.pydoclint]
style = "google"
quiet = true
# Types live in the signature and are never repeated in the docstring.
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
# A summary alone is not a complete docstring for anything with parameters.
skip-checking-short-docstrings = false
check-arg-order = true
skip-checking-raises = false
should-document-star-arguments = true
# __init__ documents its own parameters (ruff's D107 requires the docstring);
# the class docstring describes the object, not its constructor.
allow-init-docstring = true
# A None-returning function without a return statement needs no Returns.
require-return-section-when-returning-nothing = false
# Fields are documented where they are declared (pydantic Field descriptions,
# attribute comments), not repeated in an Attributes section.
check-class-attributes = false
# A NumPy- or Sphinx-style docstring that sneaks in is a mismatch, not a pass.
check-style-mismatch = true

[tool.mypy]
strict = true
files = ["src/huron"]

[[tool.mypy.overrides]]
# asyncpg ships no py.typed marker. The two Postgres store adapters, the
# composition root and its runtime pool holder are the modules that touch
# it, and each narrows every row to a typed record at its own boundary, so
# the driver's own annotations buy nothing here.
module = "asyncpg.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: fast, no I/O",
    "contract: exercises a port against a real or fake adapter",
    "integration: exercises the composed application against real services",
    "acceptance: exercises a full phase gate end to end",
]
addopts = "-m unit --strict-markers"

[tool.importlinter]
root_package = "huron"
include_external_packages = true

# Dependencies point inward; application composition roots also import adapters.
[[tool.importlinter.contracts]]
name = "applications depend on core then packages then schema"
type = "layers"
layers = ["huron.applications", "huron.core", "huron.pkg", "huron.schema"]

# Domain packages and POSIX storage remain independent; metastore consumes domain types.
[[tool.importlinter.contracts]]
name = "Packages are independent of one another"
type = "independence"
modules = [
    "huron.pkg.auth", "huron.pkg.catalog", "huron.pkg.rawstore", "huron.pkg.rbac",
]

# Entry points share core workflows, never import one another.
[[tool.importlinter.contracts]]
name = "Applications are independent of one another"
type = "independence"
modules = [
    "huron.applications.api",
]

# The two decision-making packages hold rules, not I/O. Web frameworks, storage
# SDKs and database drivers reach them only as an injected Protocol. Data-modeling
# and validation libraries are deliberately absent from this list: huron.schema is
# definitionally built on them, and catalog validates against it.
[[tool.importlinter.contracts]]
name = "catalog and rbac are framework-free"
type = "forbidden"
source_modules = ["huron.pkg.catalog", "huron.pkg.rbac"]
forbidden_modules = [
    "fastapi",
    "uvicorn",
    "starlette",
    "sqlalchemy",
    "asyncpg",
    "alembic",
    "aiobotocore",
    "boto3",
    "botocore",
    "lancedb",
    "icechunk",
    "zarr",
    "httpx",
    "structlog",
    "prometheus_client",
]

# AuthN sits in the same "no web framework, no DB driver" tier as catalog and
# rbac, but it is deliberately not folded into the contract above: it makes
# real outbound HTTP calls to an IdP's token/JWKS endpoints and hashes
# credentials, so httpx, pyjwt, and argon2-cffi are allowed here on purpose.
[[tool.importlinter.contracts]]
name = "auth is web-framework-free"
type = "forbidden"
source_modules = ["huron.pkg.auth"]
forbidden_modules = [
    "fastapi", "starlette", "uvicorn", "sqlalchemy", "asyncpg", "alembic",
]

# The authorization package is entered through its public surface. Its five
# submodules are one unit with one contract; a route that reaches past
# __init__ into guards.py or decisions.py is depending on an arrangement of
# internals, not on the guarantee the package makes.
[[tool.importlinter.contracts]]
name = "the authorization package is entered through its public surface"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["huron.applications.api.routes.**", "huron.applications.api.app"]
forbidden_modules = ["huron.applications.api.authorization.*"]

# Concrete persistence adapters depend on domain types, never the reverse.
[[tool.importlinter.contracts]]
name = "domain packages do not depend on persistence adapters"
type = "forbidden"
source_modules = ["huron.pkg.catalog", "huron.pkg.rbac", "huron.pkg.auth", "huron.pkg.rawstore"]
forbidden_modules = ["huron.pkg.metastore"]

[[tool.importlinter.contracts]]
name = "core uses ports rather than concrete infrastructure"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["huron.core"]
forbidden_modules = [
    "huron.pkg.metastore", "huron.pkg.rawstore", "fastapi", "starlette",
    "uvicorn", "asyncpg", "sqlalchemy", "ray", "boto3", "aiobotocore",
]

[tool.ty.src]
include = ["src/huron"]

[tool.coverage.report]
# Ratchet floor: the measured value at the last raise, rounded down. Never
# lower it; raise it as coverage climbs. New or touched files are covered in
# full.
fail_under = 94

[[tool.importlinter.contracts]]
name = "API endpoints cannot call internal workflow implementations"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["huron.applications.api.routes.**"]
forbidden_modules = ["huron.core._catalog", "huron.core._ingest", "huron.core._revision_reader"]
