apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: huron
    includeSelectors: true
resources:
  - configmap.yaml
  - migrate-job.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
images:
  - name: huron
    newName: image-registry.openshift-image-registry.svc:5000/huron/huron
    newTag: "1.0.0"
